<section class="container-fluid position-relative auth-wrap">
    <div class="navbar-brand ms-2 ms-sm-3 mt-3 mt-sm-4">
        <img class="img-fluid" [src]="'/images/hfactor-logo-dark.png' | assetUrl" alt="HfactoR" />
    </div>

    <!-- Login Card Starts here -->
    <div
        class="container auth-container d-flex align-items-start align-items-md-center justify-content-center z-50 position-relative">
        <div class="card shadow border-0 p-md-1">
            <!-- Card Body Starts here -->
            <div class="card-body p-md-4 p-3">
                <div class="client-logo d-flex justify-content-center align-items-center mx-md-auto ms-0"
                    *ngIf="urlCode !== 'qc'">
                    <img class="max-h-100 max-w-100" [src]="logoSrc | assetUrl" (error)="onLogoError()"
                        alt="Client Name" />
                </div>

                <!-- Login Form -->
                <div *ngIf="!showForgotPassword">
                    <!-- Login Starts -->
                    <h4 class="text-start text-md-center my-3">Login</h4>
                    <form [formGroup]="loginForm" action="#" class="">
                        <div class="mb-3">
                            <label for="username" class="form-label mb-1">Username</label>
                            <div class="p-fluid position-relative">
                                <input pInputText pSize="large" type="text" formControlName="username" name="username"
                                    placeholder="Enter your username"
                                    [ngClass]="{'ng-invalid ng-dirty': loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)}" />
                                <i class="pi pi-exclamation-circle text-danger  position-absolute top-50 end-0 translate-middle-y me-3"
                                    *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)"></i>
                            </div>
                            <small class="text-danger d-block text-start mt-1"
                                *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)">
                                {{ VALIDATION_MESSAGES.USERNAME_REQUIRED }}
                            </small>
                        </div>
                        <div class="mb-2">
                            <label for="password" class="form-label mb-1">Password</label>
                            <div class="p-fluid position-relative">
                                <p-password [feedback]="false" formControlName="password" name="password"
                                    [toggleMask]="!(loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched))"
                                    placeholder="Enter your password"
                                    [ngClass]="{'ng-invalid ng-dirty': loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)}"
                                    styleClass="w-100"
                                    [inputStyleClass]="'w-100' + (loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched) ? ' ng-invalid ng-dirty' : '')" />
                                <i class="pi pi-exclamation-circle text-danger position-absolute top-50 end-0 translate-middle-y me-3"
                                    *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
                                    style="z-index: 10;"></i>
                            </div>
                            <small class="text-danger d-block text-start mt-1"
                                *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
                                {{ VALIDATION_MESSAGES.PASSWORD_REQUIRED }}
                            </small>
                        </div>
                        <p class="text-end mb-4"><a href="javascript:void(0)" (click)="showForgotPasswordFlow()"
                                class="link-primary"><small>{{ UI_LABELS.FORGOT_PASSWORD }}</small></a></p>
                        <!-- Server error state: replaces button entirely -->
                        <div *ngIf="serverError; else loginButton"
                            class="server-error-banner d-flex align-items-start gap-2 w-100 p-2 rounded">
                            <i class="pi pi-shield mt-1 flex-shrink-0"></i>
                            <span>{{ serverError }}</span>
                        </div>

                        <!-- Login button (normal / initial-loading / submitting) -->
                        <ng-template #loginButton>
                            <button type="submit" (click)="login()" [disabled]="isLoginLoading || isInitialLoading"
                                class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">

                                <!-- Initial config loading -->
                                <ng-container *ngIf="isInitialLoading">
                                    <i class="pi pi-spin pi-spinner small-spinner"></i>
                                    <span>{{ UI_LABELS.BTN_PLEASE_WAIT }}</span>
                                </ng-container>

                                <!-- Login submit in progress -->
                                <ng-container *ngIf="!isInitialLoading && isLoginLoading">
                                    <i class="pi pi-spin pi-spinner small-spinner"></i>
                                    <span>{{ UI_LABELS.BTN_LOGGING_IN }}</span>
                                </ng-container>

                                <!-- Idle state -->
                                <span *ngIf="!isInitialLoading && !isLoginLoading">{{ UI_LABELS.BTN_LOGIN }}</span>

                            </button>
                        </ng-template>
                    </form>
                    <!-- <p class="text-center text-lightgray my-2 text-sm">or</p>
                    <button type="submit" (click)="loginWithGoogle()" [disabled]="isGoogleLoginLoading"
                        class="btn btn-white shadow-sm w-100">
                        <img *ngIf="!isGoogleLoginLoading" class="me-2" [src]="'/images/google-ico.svg' | assetUrl"
                            alt="">
                        <span *ngIf="!isGoogleLoginLoading">Login with Google</span>
                        <ng-container *ngIf="isGoogleLoginLoading">
                            <span>Logging in...</span>
                            <i class="pi pi-spin pi-spinner small-spinner"></i>
                          </ng-container>
                    </button> -->
                </div>

                <!-- Forgot Password Form -->
                <div *ngIf="showForgotPassword && _authenticationConfiguration">
                    <app-forgot-password [companyId]="_authenticationConfiguration.CompanyId"
                        [userType]="_authenticationConfiguration.UserType" [clientCode]="clientCode"
                        [authConfigId]="_authenticationConfiguration.Id"
                        (backToLogin)="hideForgotPasswordFlow()"></app-forgot-password>
                </div>

                <div class="text-center mt-4">
                    <p class="mb-2 text-gray">Get our Apps</p>
                    <div class="d-flex justify-content-center store-badges">
                        <a class="me-2" href="javascript:;" (click)="openStore(googlePlayUrl)">
                            <img [src]="'/images/google-play-ico.svg' | assetUrl" alt="Google Play" />
                        </a>
                        <a href="javascript:;" (click)="openStore(appStoreUrl)">
                            <img [src]="'/images/app-store-ico.svg' | assetUrl" alt="App Store">
                        </a>
                    </div>
                </div>
            </div>
            <!-- Card Body Ends here -->
            <p class="text-end mb-0 help-link" *ngIf="showHelpLink">
                <a href="javascript:void(0)" (click)="openHelpLink()" class="link-primary text-decoration-none"
                    target="_blank" rel="noopener"><small class="me-1">Get Help</small>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path
                            d="M479.56-255.39q17.13 0 28.94-11.82 11.81-11.83 11.81-28.97 0-17.13-11.83-28.94-11.83-11.8-28.96-11.8-17.13 0-28.94 11.83-11.81 11.83-11.81 28.96 0 17.13 11.83 28.94 11.83 11.8 28.96 11.8Zm.51 155.39q-78.84 0-148.21-29.92t-120.68-81.21q-51.31-51.29-81.25-120.63Q100-401.1 100-479.93q0-78.84 29.92-148.21t81.21-120.68q51.29-51.31 120.63-81.25Q401.1-860 479.93-860q78.84 0 148.21 29.92t120.68 81.21q51.31 51.29 81.25 120.63Q860-558.9 860-480.07q0 78.84-29.92 148.21t-81.21 120.68q-51.29 51.31-120.63 81.25Q558.9-100 480.07-100Zm-.07-60q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Zm3.24-171.23q27.68 0 47.91 17.43 20.24 17.43 20.24 43.57 0 22-12.93 39.38-12.92 17.39-29.54 32.39-21.78 19.32-38.35 42.51-16.57 23.18-17.72 51.64-.39 10.93 7.69 18.31 8.08 7.38 18.84 7.38 11.54 0 19.54-7.69t10.23-18.84q4-20.62 17.04-36.73 13.04-16.12 28.25-30.65 21.87-21.32 38.17-46.48 16.31-25.17 16.31-56.14 0-47.54-37.46-78.12Q534-703.84 484-703.84q-35.69 0-67.31 15.8-31.61 15.81-49.23 46.12-5.46 9.31-3.5 19.59 1.95 10.29 10.55 15.62 10.95 6.09 22.49 3.48 11.54-2.62 19.61-13.15 12.16-15.77 29.43-25.31t37.2-9.54Z" />
                    </svg>
                </a>
            </p>
        </div>

    </div>
    <!-- Login Card Ends here -->

    <!-- Auth Bottom Wrap Starts here -->
    <div [ngStyle]="{'background-image': 'url(' + backgroundImageUrl + ')'}"
        class="auth-btm-wrap container-fluid position-absolute bottom-0 start-0">
        <div class="row align-items-end h-100">
            <div class="col-md-4 text-start d-flex align-items-end ps-4">
                <img class="me-5 d-none d-md-inline-block" [src]="'/images/l-img1.svg' | assetUrl" alt="image" />
                <img class="d-none d-xl-inline-block" [src]="'/images/l-img2.svg' | assetUrl" alt="image" />
            </div>
            <div class="col-md-4 text-center mb-4">

            </div>
            <div class="col-md-4 text-end d-flex align-items-end justify-content-end pe-4">
                <img class="d-none d-xl-inline-block" [src]="'/images/r-img2.svg' | assetUrl" alt="image" />
                <img class="ms-5 d-none d-md-inline-block" [src]="'/images/r-img1.svg' | assetUrl" alt="image" />
            </div>
        </div>
    </div>
    <!-- Auth Bottom Wrap Starts here -->
</section>
