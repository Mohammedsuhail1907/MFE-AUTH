
<div class="sso-login-content">
  <!-- Back to Login -->
  <a class="back-to-login" routerLink="/app-auth/auth/login">
    <i class="pi pi-arrow-left"></i>
    <span>Back to Login page</span>
  </a>

  <!-- SSO Heading -->
  <div class="sso-login-heading">
    <h2>Login with SSO</h2>
  </div>

  <!-- SSO Form -->
  <form (submit)="onSubmit($event)" novalidate>
    <!-- Company Code -->
    <div class="sso-login-field">
      <label for="companyCode" class="auth-v2-label">
        Company Code
      </label>

      <input
        id="companyCode"
        type="text"
        class="auth-v2-input"
        placeholder="Enter Company Code"
        autocomplete="organization"
        required
      />
    </div>

    <!-- Continue Button -->
    <button
      type="submit"
      class="auth-v2-primary-button continue-sso-button"
    >
      Continue with SSO
    </button>
  </form>
</div>
