
<div class="auth-v2-layout">

  <!-- Left branding panel -->
  <section class="auth-v2-brand-panel">

    <div class="brand-background"></div>
    <div class="brand-overlay"></div>

    <!-- HFactor logo -->
    <div class="brand-logo">
      <img
        src="assets/images/hfactor_white.png"
        alt="Hfactor"
      />
    </div>

    <!-- Branding content -->
    <div class="brand-content">

      <div class="brand-message">
        <h1>
          Every part of<br />
          the employee journey.
        </h1>

        <p>
          One CIEL HR account across every<br />
          product your organisation uses.
        </p>
      </div>

      <div class="brand-divider"></div>

      <!-- CIEL branding -->
      <div class="powered-by">
        <span>POWERED BY</span>

        <img
          src="assets/images/ciel-logo-white.png"
          alt="CIEL"
        />
      </div>

      <!-- Partner logos -->
      <div class="partner-section">
        <span>PART OF THE CIEL HR GROUP</span>

        <img
          src="assets/images/partner-logos.svg"
          alt="CIEL HR Group partners"
        />
      </div>

    </div>

  </section>

  <!-- Right content panel -->
  <section class="auth-v2-content-panel">

    <div
  class="auth-v2-language"
  [class.hide-language]="isForgotPasswordPage"
>
        <i class="pi pi-globe language-icon"></i>
        <span>English</span>
        <i class="pi pi-chevron-down language-arrow"></i>
    </div>

    <div class="auth-v2-page-content">
      <router-outlet></router-outlet>
    </div>

    <!-- App download badges: login screen only -->
    <div class="auth-v2-store-badges" *ngIf="showStoreBadges">

      <img
        src="assets/images/google-play-ico.svg"
        alt="Get it on Google Play"
      />

      <img
        src="assets/images/app-store-ico.svg"
        alt="Download on the App Store"
      />

    </div>

  </section>

</div>
