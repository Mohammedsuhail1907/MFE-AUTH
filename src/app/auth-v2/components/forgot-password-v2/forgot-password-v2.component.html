<div class="forgot-password-content">

  <a class="back-to-login" href="#/app-auth-v2/login">
    <i class="pi pi-arrow-left"></i>
    <span>Back to Login page</span>
  </a>

  <div class="forgot-password-heading">
    <h2>Recover Password</h2>
    <p>
      Enter your username/email and we'll send you a link to
      reset your password
    </p>
  </div>

  <form
  *ngIf="currentStep === ForgotPasswordStep.USERNAME"
  (submit)="onSubmit($event)"
  novalidate>

    <div class="forgot-password-field">
      <label for="username">Username</label>

      <input
        id="username"
        type="text"
        placeholder="Email@company.com"
        autocomplete="username"
        required
      />
    </div>

    <button type="submit" class="send-link-button"
        [disabled]="isGetOtpLoading">
  {{ isGetOtpLoading ? 'Sending...' : 'Send Link to Email' }}
</button>

  </form>
  
<form
  *ngIf="currentStep === ForgotPasswordStep.OTP"
  (ngSubmit)="onVerifyOtp()">

  <div class="forgot-password-field">
    <label for="otp">Enter OTP</label>

    <input
      id="otp"
      type="text"
      name="otp"
      [(ngModel)]="otpValue"
      [maxlength]="ForgotpwdOTPlength"
      placeholder="Enter verification code"
      autocomplete="one-time-code"
    />
  </div>

  <button
    type="submit"
    class="send-link-button"
    [disabled]="isVerifyOtpLoading ||
                otpValue.length !== ForgotpwdOTPlength">

    {{ isVerifyOtpLoading ? 'Verifying...' : 'Verify OTP' }}

  </button>

</form>


</div>
