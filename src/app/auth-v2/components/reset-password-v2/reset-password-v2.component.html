
<div class="reset-password-content">
  <!-- Back to Login -->
  <a class="back-to-login" href="#/app-auth-v2/login">
    <i class="pi pi-arrow-left"></i>
    <span>Back to Login page</span>
  </a>

  <!-- Reset Password Heading -->
  <div class="reset-password-heading">
    <h2>Reset Password</h2>
  </div>

  <!-- Reset Password Form -->
  <form (submit)="onSubmit($event)" novalidate>
    <!-- New Password -->
    <div class="reset-password-field">
      <label for="newPassword" class="auth-v2-label">
        New Password
      </label>

      <div class="password-input-wrapper">
        <input
          id="newPassword"
          class="auth-v2-input reset-password-input"
          [type]="showNewPassword ? 'text' : 'password'"
          placeholder="Enter new password"
          autocomplete="new-password"
          [value]="newPassword"
          (input)="onNewPasswordInput($event)"
          required
        />

        <button
          type="button"
          class="password-toggle"
          (click)="showNewPassword = !showNewPassword"
          aria-label="Toggle new password visibility"
        >
          <i [class]="showNewPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </div>
    </div>

    <!-- Re-enter New Password -->
    <div class="reset-password-field">
      <label for="confirmPassword" class="auth-v2-label">
        Re-Enter New Password
      </label>

      <div class="password-input-wrapper">
        <input
          id="confirmPassword"
          class="auth-v2-input reset-password-input"
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Re-enter new password"
          autocomplete="new-password"
          [value]="confirmPassword"
          (input)="onConfirmPasswordInput($event)"
          required
        />

        <button
          type="button"
          class="password-toggle"
          (click)="showConfirmPassword = !showConfirmPassword"
          aria-label="Toggle confirm password visibility"
        >
          <i [class]="showConfirmPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </div>

      <small class="password-error" *ngIf="passwordMismatch">
        Passwords do not match.
      </small>
    </div>

    <!-- Password Requirements -->
    <div class="password-requirements">
      <p>Your password must contain</p>

      <div class="requirements-grid">
        <div class="requirement-item" [class.valid]="hasUppercase">
          <i [class]="hasUppercase ? 'pi pi-check-circle' : 'pi pi-circle'"></i>
          <span>One upper case letter</span>
        </div>

        <div class="requirement-item" [class.valid]="hasLowercase">
          <i [class]="hasLowercase ? 'pi pi-check-circle' : 'pi pi-circle'"></i>
          <span>One lower case letter</span>
        </div>

        <div class="requirement-item" [class.valid]="hasNumber">
          <i [class]="hasNumber ? 'pi pi-check-circle' : 'pi pi-circle'"></i>
          <span>One number</span>
        </div>

        <div class="requirement-item" [class.valid]="hasSpecialCharacter">
          <i [class]="hasSpecialCharacter ? 'pi pi-check-circle' : 'pi pi-circle'"></i>
          <span>One special character</span>
        </div>
      </div>
    </div>

    <!-- Submit Error -->
    <small class="password-error submit-error" *ngIf="submitError">
      {{ submitError }}
    </small>

    <!-- Change Password Button -->
    <button
      type="submit"
      class="auth-v2-primary-button change-password-button"
      [disabled]="!isPasswordValid || !confirmPassword || passwordMismatch"
    >
      Change Password
    </button>
  </form>
</div>
