
<div class="auth-container d-flex align-items-center justify-content-center">

  <div class="card border-0 auth-card">

    <div class="card-body">

      <!-- Client logo -->
      <div class="hfactor-client-logo">
        <img
          [src]="logoSrc"
          alt="Hfactor Logo"
          (error)="onLogoError()"
        />
      </div>

      <!-- Login form -->
      <div class="login-content">

        <div class="login-heading">
          <h4>Welcome !</h4>
          <p>Sign in to continue.</p>
        </div>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="login()"
          novalidate
        >

          <!-- Username -->
          <div class="mb-3">

            <label for="username" class="form-label">
              Username <span class="text-danger">*</span>
            </label>

            <div class="p-fluid position-relative">

              <input
                id="username"
                pInputText
                type="text"
                formControlName="username"
                name="username"
                placeholder="Enter Username"
                autocomplete="username"
                [ngClass]="{
                  'ng-invalid ng-dirty':
                    loginForm.get('username')?.invalid &&
                    (loginForm.get('username')?.dirty ||
                     loginForm.get('username')?.touched)
                }"
              />

              <i
                class="pi pi-exclamation-circle text-danger position-absolute top-50 end-0 translate-middle-y me-3"
                *ngIf="
                  loginForm.get('username')?.invalid &&
                  (loginForm.get('username')?.dirty ||
                   loginForm.get('username')?.touched)
                "
              ></i>

            </div>

            <small
              class="text-danger d-block text-start mt-1"
              *ngIf="
                loginForm.get('username')?.hasError('required') &&
                (loginForm.get('username')?.dirty ||
                 loginForm.get('username')?.touched)
              "
            >
              Required
            </small>

          </div>

          <!-- Password -->
          <div class="mb-2">

            <label for="password" class="form-label">
              Password <span class="text-danger">*</span>
            </label>

            <div class="p-fluid position-relative">

              <p-password
                [feedback]="false"
                formControlName="password"
                name="password"
                [toggleMask]="true"
                placeholder="Enter your password"
                autocomplete="current-password"
                styleClass="w-100"
                [inputStyleClass]="'w-100' + (
                  loginForm.get('password')?.invalid &&
                  (loginForm.get('password')?.dirty ||
                   loginForm.get('password')?.touched)
                    ? ' ng-invalid ng-dirty' : ''
                )"
              ></p-password>

            </div>

            <small
                class="text-danger d-block text-start mt-1"
                *ngIf="
                    loginForm.get('password')?.hasError('required') &&
                    (loginForm.get('password')?.dirty ||
                    loginForm.get('password')?.touched)
                "
                >
                {{ VALIDATION_MESSAGES.PASSWORD_REQUIRED }}
            </small>

          </div>

          <!-- Forgot password -->
          <p class="text-end forgot-password mb-4">
            <a
              href="javascript:void(0)"
              (click)="goToForgotPassword()"
              class="link-primary"
            >
              <small>{{ UI_LABELS.FORGOT_PASSWORD }}</small>
            </a>
          </p>

          <!-- Server error -->
          <div
            *ngIf="serverError; else loginButton"
            class="server-error-banner d-flex align-items-start gap-2 w-100 p-2 rounded"
          >
            <i class="pi pi-shield mt-1 flex-shrink-0"></i>
            <span>{{ serverError }}</span>
          </div>

          <!-- Login button -->
          <ng-template #loginButton>

            <button
              type="submit"
              [disabled]="isLoginLoading || isInitialLoading"
              class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
            >

              <ng-container *ngIf="isInitialLoading">
                <i class="pi pi-spin pi-spinner"></i>
                <span>{{ UI_LABELS.BTN_PLEASE_WAIT }}</span>
              </ng-container>

              <ng-container
                *ngIf="!isInitialLoading && isLoginLoading"
              >
                <i class="pi pi-spin pi-spinner"></i>
                <span>{{ UI_LABELS.BTN_LOGGING_IN }}</span>
              </ng-container>

              <span
                *ngIf="!isInitialLoading && !isLoginLoading"
              >
                {{ UI_LABELS.BTN_LOGIN }}
              </span>

            </button>

          </ng-template>

        </form>

        <!-- Single sign-on -->
        <div class="login-divider">
          <span></span>
          <small>or</small>
          <span></span>
        </div>

        <button
          type="button"
          class="sso-button"
          (click)="goToSsoLogin()"
        >
          Continue with single sign-on
        </button>

        <p class="admin-message text-center">
          Need access? Contact your administrator.
        </p>

      </div>

    </div>

  </div>

</div>
